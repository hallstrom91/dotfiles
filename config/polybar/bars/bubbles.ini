;-------------------------------------;
;;; App Launcher ;;;
[open-base]
type = custom/text
format-font = 4
format-padding = 1
format-background = ${colors.bg-hex}

[module/open_home]
inherit = open-base
format = ${theme-ic.home}
click-left = nautilus ~

[module/open_firefox]
inherit = open-base
format = ${theme-ic.firefox}
click-left = firefox

[module/open_chrome]
inherit = open-base
format = ${theme-ic.chrome}
click-left = google-chrome

; [module/open_steam]
; inherit = open-base
; format = ${theme-ic.steam}
; ; click-left = steam

[module/open_term]
inherit = open-base
format = ${theme-ic.terminal}
click-left = wezterm

[module/open_spotify]
inherit = open-base
format = ${theme-ic.spotify}
click-left = spotify


;-------------------------------------;
;;; Spotify / Media ;;;
[module/spotify]
type = custom/script
exec = ~/.bin/polybar/spotify.sh
tail = true
label = %output%

[module/nightlight]
type = custom/ipc
hook-0 = ~/.bin/polybar/nightlight.sh --print
initial = 1
click-left = bash -lc '~/.bin/polybar/nightlight.sh --toggle; polybar-msg hook nightlight 1 >/dev/null'
format = <output>
format-background = ${colors.bg-hex}
format-padding = 1
label = %output%

[module/kde]
type = custom/ipc
hook-0 = ~/.bin/polybar/kde.sh --print
initial = 1
click-left = bash -lc '~/.bin/polybar/kde.sh --menu; polybar-msg hook kde 1 >/dev/null'
format = <output>
format-background = ${colors.bg-hex}
format-padding = 1
label = %output%

