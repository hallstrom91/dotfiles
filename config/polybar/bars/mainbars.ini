; Main primary screen = maintopbar
; eth/wlan: speed-up|down
; none
; audio
[bar/maintopbar]
inherit = bar/base
monitor = "DP-2"
width = 100%
bottom = false
padding-left = 2
padding-right = 2
; radius = 5%
; override-redirect = true
; wm-restack = i3
; offset-y = 1%
; offset-x = 5%

; modules-left = i3
modules-left = i3
modules-center =
modules-right = networkspeed pulseaudio kdeconnect

; Main primary screen = mainbotbar
; Launcher
; none
; memory, cpu+temp
[bar/mainbotbar]
inherit = bar/base
monitor = "DP-2"
bottom = true
padding-left = 1
padding-right = 1
; override-redirect = true
; wm-restack = i3

modules-left = open_home open_firefox open_steam open_term open_spotify
modules-center = spotify
modules-right = memory cpu cpu-temp date time


[bar/secbotbar]
inherit = bar/base
monitor = "DP-0"
width = 100%
offset-y = 1%
offset-x = 5%
bottom = true
; radius = 5%
padding-left = 1
padding-right = 2

; modules-left = eth wlan
; modules-left = fs-root fs-ext
modules-left = fs-ext
modules-right = xkeyboard powermenu

; divider module base
; dividers declared inside modules/*.ini
; with correct colors, divider-glyph etc
[powerline-base]
type = custom/text
format-font = 4
