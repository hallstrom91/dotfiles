[ic-datetime]
clock = 󱑂
clock_outline = 󱑎
calender = 󰸗

;----------------------------
;; Date / Time
;----------------------------

[date-base]
type = internal/date
interval = 1

[module/time]
inherit = date-base
time = %H:%M

format = <label>
format-prefix-font = 4
format-prefix = ${ic-datetime.clock_outline}
format-prefix-padding-right = 1

label = %time%
label-font = 1

[module/date]
inherit = date-base
date = %Y-%m-%d%

format = <label>
format-prefix-font = 4
format-prefix = ${ic-datetime.calender}
format-prefix-padding-right = 1

label = %date%
label-font = 1


