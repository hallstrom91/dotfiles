[ic-xkeyboard]
keyboard = 󰌓

[module/xkeyboard]
type = internal/xkeyboard
; blacklist-0 = num lock
; capslock rebind to F13 - no need
; blacklist-1 = caps lock

format-prefix = ${ic-xkeyboard.keyboard}
format-prefix-padding = 1
format-prefix-font = 4
format-prefix-foreground = ${colors.hilite}

; label-layout = %name%
label-layout = %layout%
label-layout-foreground = ${colors.fg-alt}
label-layout-font = 1

label-indicator-padding = 1
label-indicator-margin = 1
label-indicator-foreground = ${colors.bg}
label-indicator-background = ${colors.hilite}
