# END OF: SHAPE TEST CONTAINER + CONTENT

# DP-2: 'PASSWORD'-input-field
input-field {
    monitor = DP-2
    # size = 20%, 5%
    size = 400, 50
    outline_thickness = 3
    fade_on_empty = true
    fade_timeout = 4000 # value in MS
    rounding = 10
    hide_input = false # default
    hide_input_base_color = rgba(91, 75, 138, 1.0)
    dots_size = 0.15 # default 0.25
    dots_spacing = 0.30 # 0.15
    dots_center = true 
    dots_rounding = -1 # round
    font_size = $text_size
    font_family = $font
    font_color = $fg
    inner_color = rgba(0, 0, 0, 0.0)  # no fill
    outer_color = $border 45deg
    placeholder_text = <span foreground="##c8d0d966">Feed me with stars, to unlock the secrets of the universe.</span>
    check_color =  $border 120deg
    # capslock_color = $warn 90deg
    # numlock_color = $warn 90deg
    # bothlock_color = $warn 90deg
    invert_numlock = true
    fail_color = $fail 45deg
    fail_text = <span foreground="##ff6b6b">Wrong!</span>
    fail_transitions = 300
    position = 0, 35
    halign = center
    valign = center
}

# DP-2: system uptime
label {
    monitor = DP-2
    text = cmd[update:60000] /usr/bin/env bash -lc 'printf "uptime: %s" "$(uptime -p | sed "s/^up //")"'
    color = $fg_dim
    font_size = $text_size
    font_family = $font
    position = 0, -35
    halign = center
    valign = center
}

# DP-2: Shutdown-icon
label {
    monitor = DP-2
    text = <span foreground="##33ccffee"> 󰐥 </span>
    font_size = $icon_size
    font_family = $font
    position = 0, -70 
    halign = center
    valign = center
    # onclick = /usr/bin/env bash -lc '$HOME/.config/waybar/scripts/powermenu.sh --poweroff' # update path + flag
}


##############################
### DP-1: secondary screen ###
##############################

# DP-1: background
background {
    monitor = DP-1
    path = ~/Pictures/hyprpaper/wife_flash_and_uap.png
    fit_mode = cover
}

