### hyprlock | https://wiki.hypr.land/Hypr-Ecosystem/hyprlock/ ###
# example config | https://github.com/hyprwm/hyprlock/blob/main/assets/example.conf

$font = JetBrainsMono Nerd Font
$text_size = 18
$title_size = 22 # remove ? still unused ?
$icon_size = 28
$lock_datetime = printf "%s\n%s" "$(date +%H:%M)" "$(date +\"%A, %d, %B\")"


# Theme variables #
# transparency value in rgba(RRGGBBAA) = 'AA';
# ff=100% | cc=80% | 99=60% | 66=40% | 1a = 10%
$bg = rgba(11, 15, 20, 1.0)
$fg = rgba(200, 208, 217, 1.0)
$fg_dim = rgba(200, 208, 217, 0.6)
$shadow = rgba(0, 0, 0, 0, 66) 
$inactive = rgba(241, 241, 241, 0.4) rgba(220, 215, 201, 0.102) 
$border = rgba(91, 75, 138, 1.0) rgba(74, 143, 208, 1.0)
$fail = rgba(255, 107, 107, 0.93) rgba(255, 204, 102, 0.93)

$shape_bg = rgba(11, 15, 20, 0.7)
$shape_border = rgba(74, 143, 208, 0.7) rgba(91, 75, 138, 0.7)

# $shape_border_blue = rgba(74, 143, 208, 1)
# $shape_border_purple = rgba(91, 75, 138, 0.7)

# https://wiki.hypr.land/Hypr-Ecosystem/hyprlock/#general
general {
    hide_cursor = false
    ignore_empty_input = true
    fractional_scaling = 0 # disabled
    screencopy_mode = 0 # GPU accelerated
    fail_timeout = 2000 # default
    # fractional_scaling = 2 # auto
}

# https://wiki.hypr.land/Hypr-Ecosystem/hyprlock/#animations
animations {
    enabled = true # false turns off 

    bezier = linear, 0, 0, 1, 1 
    bezier = takeoff, 1.00, 0.01, 0.19, 0.99
    bezier = brake, 0.00, 0.00, 0.01, 0.98 

    animation = fadeIn, 1, 8,  linear # fade to lockscreen
    animation = fadeOut, 1, 4, linear # fade back to desktop
    animation = inputFieldColors, 1, 8, takeoff
    animation = inputFieldDots, 1, 10, brake
    animation = inputFieldWidth, 1, 8, linear
}

############################
### DP-2: primary screen ###
############################

# DP-2: background
background {
    monitor = DP-2
    path = screenshot # or: ~/path/to/file.png
    color = $bg
    blur_passes = 2
    blur_size = 2
}

# SHAPE TEST CONTAINER + CONTENT
shape {
    monitor = DP-2
    size = 300, 400
    color = $shape_bg
    rounding =  10
    border_size = 4 
    border_color = $shape_border 75deg
    position = -400, 150 # layout-XY
    halign = center 
    valign = center 
    z-index = 1
}

shape {
    monitor = DP-2
    size = 300, 96
    color = $shape_bg
    rounding =  5
    border_size =  4
    border_color = $shape_border 75deg
    position = 0, -30 # layout-XY
    halign = center 
    valign =  top
    z-index = 1
}

label {
    monitor = DP-2
    # text = cmd[update:1000] sh -lc 'printf "%s\n%s" "$(date +%H:%M)" "$(date +\"%A, %d, %B\")"' 
    text = cmd[update:1000] ~/.config/hypr/scripts/lock_datetime.sh
    text_align = center
    font_size = 48
    font_family = $font
    position = 0, -36
    halign = center
    valign = top
    z-index = 2
}




