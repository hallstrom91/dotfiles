### interface (GUI) | base UI settings ###

# Theme variables 
# transparency value in rgba(RRGGBBAA) = alter last 'AA';
# ff=100% | cc=80% | 99=60% | 66=40% | 1a = 10%
$shadow = rgba(00000066) 
$inactive = rgba(f1f1f166) rgba(dcd7c91a) 
$border = rgba(5b4b8aff) rgba(4a8fd0ff)
$font = JetBrainsMono Nerd Font

# https://wiki.hypr.land/Configuring/Variables/#general
general {
    border_size = 3
    gaps_in = 2 # between windows
    gaps_out = 10 # between window and monitor edge

    # https://wiki.hypr.land/Configuring/Variables/#variable-types for info about colors
    # col.active_border = rgba(4a8fd0ff) rgba(5b4b8aff) 45deg
    col.active_border = $border 45deg
    col.inactive_border = $inactive 60deg

    # col.active_border = rgba(33ccffee) rgba(00ff99ee) 45deg     
    # col.inactive_border = rgba(595959aa) 

    resize_on_border = false # resize by mouse drag (if true)

    # Please see https://wiki.hypr.land/Configuring/Tearing/ before you turn this on
    allow_tearing = false

    layout = dwindle

    snap {
        enabled = true
    }
}

# https://wiki.hypr.land/Configuring/Variables/#decoration
decoration {
    rounding = 10
    rounding_power = 2

    active_opacity = 0.99
    inactive_opacity = 0.95 

    dim_inactive = true # inactive_opacity instead
    dim_strength = 0.3 # default: 0.5

    dim_modal = true 
    dim_special = 0.90 # default: 0.2
    dim_around = 0.4 # default: 0.4

    shadow {
        enabled = true
        range = 4
        render_power = 3
        color = $shadow
    }

    # https://wiki.hypr.land/Configuring/Variables/#blur
    blur {
        enabled = true
        size = 8
        passes = 1
        vibrancy = 0.1696
        ignore_opacity = true
    }
}

# https://wiki.hypr.land/Configuring/Dwindle-Layout/ for more
dwindle {
    pseudotile = true # Master switch for pseudotiling. Enabling is bound to mainMod + P in the keybinds section below
    preserve_split = true # You probably want this
}

# https://wiki.hypr.land/Configuring/Master-Layout/ for more
master {
    new_status = master
    mfact = 0.70
    # orientation = left
    # allow_small_split = true
    # smart_resizing = false
    # new_on_top = false
    # new_on_active = after
}

# https://wiki.hypr.land/Configuring/Variables/#misc
misc {
    force_default_wallpaper = 0
    # force_default_wallpaper = -1 # Set to 0 or 1 to disable the anime mascot wallpapers
    disable_hyprland_logo = false # If true disables the random hyprland logo / anime girl background. :(
    font_family = $font
    col.splash = rgba(222831ff)
    splash_font_family = JetBrainsMono NF
    disable_autoreload = false
    background_color = rgba(222831ff) # only if no wallpaper
    focus_on_activate = true # def: false
    on_focus_under_fullscreen = 0
}

binds {
    workspace_center_on = 1 # dont center mouse on ws-switch;
}

cursor {
    hide_on_key_press = true # false
}



