### binds.conf | binds ###

# Binds | https://wiki.hypr.land/Configuring/Binds/ 
$mainMod = SUPER_L
$altMod = SUPER_R


# Exit / Kill / Reload
bind = $mainMod SHIFT, Q, killactive
bind = $mainMod SHIFT, L, exec, hyprlock 
bind = $mainMod, W, exec, $waybar_reload # move to submap:apps or something

# Launcher / FileManager / Terminal
bind = $mainMod, D, exec, ~/.config/hypr/scripts/wofi.sh --drun # move script to config/wofi/scripts
bind = $mainMod, F, exec, $filemanager 
bind = $mainMod, Return, exec, $terminal 

# Printscreen
bindr = , Print, exec, ~/.config/hypr/scripts/screenshot.sh --region # no submap

# Move focus with mainMod + [h/l/k/j]
bind = $mainMod, h, movefocus, l
bind = $mainMod, l, movefocus, r
bind = $mainMod, k, movefocus, u
bind = $mainMod, j, movefocus, d

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Special Workspaces

# special:magic (all screens/ws)
bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspace, special:magic
#special:mail  (only DP-0)
bind = $mainMod, M, exec, hyprctl dispatch focusmonitor DP-1; hyprctl dispatch togglespecialworkspace mail 
#special:dotfiles (only DP-2)
bind = $mainMod, N, exec, hyprctl dispatch focusmonitor DP-2; hyprctl dispatch togglespecialworkspace dotfiles # change "N" ?

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Laptop multimedia keys for volume and LCD brightness
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl -e4 -n2 set 5%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 5%-

# Move/resize windows with mainMod + LMB/RMB and dragging
# bindm = $mainMod, mouse:272, movewindow # uncomment IF -> resize_on_border = true (variables.conf)
# bindm = $mainMod, mouse:273, resizewindow # same

# Requires playerctl
# bindl = , XF86AudioNext, exec, playerctl next
# bindl = , XF86AudioPause, exec, playerctl play-pause
# bindl = , F86AudioPlay, exec, playerctl play-pause
# bindl = , XF86AudioPrev, exec, playerctl previous

###############
### SUBMAPS ###

# Submap: window 
bind = $mainMod SHIFT, W, exec, ~/.config/hypr/scripts/submap-state.sh --window
bind = $mainMod SHIFT, W, submap, window
submap = window
bind = , V, togglefloating
bind = , P, pseudo
bind = , J, togglesplit 
bind = , escape, submap, reset
submap = reset

# Submap: scrnshot 
bindr = $mainMod SHIFT, Print, exec, ~/.config/hypr/scripts/submap-state.sh --screenshot
bindr = $mainMod SHIFT, Print, submap, scrnshot
submap = scrnshot
bindr = , F, exec, ~/.config/hypr/scripts/screenshot.sh --fullscreen
bindr = , F, submap, reset
bindr = , W, exec, ~/.config/hypr/scripts/screenshot.sh --window
bindr = , W, submap, reset
bind = , escape, submap, reset
submap = reset

# Submap: clipboard
bind = $mainMod SHIFT, V, exec, ~/.config/hypr/scripts/submap-state.sh --clipboard
bind = $mainMod SHIFT, V, submap, clipboard
submap = clipboard
bind = , T, exec, ~/.config/hypr/scripts/clipboard.sh --cliphist-txt
bind = , T, submap, reset
bind = , I, exec, ~/.config/hypr/scripts/clipboard.sh --cliphist-img
bind = , I, submap, reset
bind = , A, exec, ~/.config/hypr/scripts/clipboard.sh --cliphist-all
bind = , A, submap, reset
bind = , X, exec, ~/config/hl/scripts/clipboard.sh --cliphist-wipe
bind = , X, submap, reset
bind = , escape, submap, reset
submap = reset

# Submap: resize 
bind = $mainMod SHIFT, R, submap, resize
submap = resize
binde = , right, resizeactive, 10 0
binde = , left, resizeactive, -10 0
binde = , up, resizeactive, 0 -10
binde = , down, resizeactive, 0 10
bind = , escape, submap, reset
submap = reset

