### rules.conf | window|workspace-rules ###

### Window rules 
## https://wiki.hypr.land/Configuring/Window-Rules/ 
## '.*'    = match all values | e.g., 'match:<class|title> .*'
##'^$'    = match only empty values | e.g., 'match:<class|title> ^$'
## '\.'    = match literal dot in class | e.g, '^(org\.pulseaudio\.pavucontrol)$'
## '(a|b)' = group multiple values | e.g, '^(Save As|Save File)$'


# Monitor 'DP-1', locked to 'ws1+ws2+special:mail'.
workspace = 1, monitor:DP-1, default:true, persistent:true
workspace = 2, monitor:DP-1, persistent:true
workspace = special:mail, monitor:DP-1

# Monitor 'DP-2', locked to all other wspaces + special:dotfiles
workspace = 3, monitor:DP-2, default:true, persistent:true
workspace = 4, monitor:DP-2, persistent:true 
workspace = 5, monitor:DP-2
workspace = 6, monitor:DP-2
workspace = 7, monitor:DP-2
workspace = 8, monitor:DP-2
workspace = 9, monitor:DP-2
workspace = 10, monitor:DP-2
workspace = special:dotfiles, monitor:DP-2

workspace = w[tv1]s[false], gapsout:5, gapsin:0 # smart-gaps
windowrule = border_size 1, match:float 0, match:workspace w[tv1]s[false]  
windowrule = rounding 10, match:float 0, match:workspace w[tv1]s[false]


# Global rules
windowrule = suppress_event maximize, match:class .* # Ignore maximize requests from apps
windowrule = no_focus on, match:class ^$, match:title ^$, match:xwayland true, match:float true, match:fullscreen true, match:pin false # Fix some dragging issues with XWayland; 

# Global float rules
windowrule = float on, match:class ^$, match:title ^(?i:picture[- ]in[- ]picture).*
windowrule = float on, size 800 600, match:class ^$, match:title ^(Save File|Open File)$

# Global layer rules 
# layerrule = animation slide top, HUH?

# Applications (float)
windowrule {
    name = float-browser-dialog
        float = on
        center = on
        size = 800 600
        match:class = ^(firefox|google-chrome|chromium|Brave-browser|vivaldi)$
        match:title = ^(Save As|Save File|Open File).*$
# dim_around = on
}

windowrule {
    name = float-browser-pip
        float = on
        match:class = ^(firefox|google-chrome|chromium|Brave-browser|vivaldi)$
        match:title = ^(?i:picture[- ]in[- ]picture).*
        dim_around = on
}

windowrule {
    name = float-system-controllers
        float = on
        center = on
        size = 800 600
        match:class = ^(org\.pulseaudio\.pavucontrol|nm-connection-editor|blueman-manager)$
        focus_on_activate = on
}

windowrule {
    name = float-xdg-portals
        float = on
        match:class = ^(xdg-desktop-portal-gtk|xdg-desktop-portal-kde|xdg-desktop-portal-hyprland).*$
}

windowrule {
    name = float-auth-polkit
        float = on
        center = on
        focus_on_activate = on
        stay_focused = on
        no_screen_share = on
        match:class = ^(polkit-gnome-authentication-agent-1|hyprpolkitagent|org\.kde\.polkit-kde-authentication-agent-1).*$
}

windowrule {
    name = float-auth-pinentry
        float = on
        center = on
        focus_on_activate = on
        stay_focused = on
        no_screen_share = on
        match:class = ^pinentry-..*$
}

windowrule {
    name = float-app-viewers
        float = on
        focus_on_activate = on
        center = on
        size = 1024 768
        match:class = ^(geeqie|nvim-txteditor)$
}

windowrule {
    name = float-steam-selfupdater
        float = on
# match:class = ^$ # add correct class
        match:title = ^(Steam - Self Updater)$ # alt: match:title = ^Steam - Self Updater.*$
}

windowrule {
    name = float-steam
        float = on
        match:class = ^steam$
}

windowrule {
    name = float-balena-etcher
        float = on
        center = on
        focus_on_activate = on
        size = 1024 768
        match:class = ^balenaEtcher$
}

# https://wiki.hypr.land/Configuring/Workspace-Rules/
# Workspaces
windowrule {
    name = ws1-browser
        workspace = 1
        match:class = ^(firefox|google-chrome|chromium|Brave-browser|vivaldi-stable)$
        no_dim = on
        opacity = 0.99 override 1 override 0.99 override # active|inactive|fullscreen
}

windowrule {
    name = ws3-terminal
        workspace =  3
        match:class = ^(kitty|wezterm)$ 
}

windowrule {
    name = ws4-filemanager
        workspace = 4 
        match:class = ^(org\.kde\.dolphin|thunar)$
        no_dim = on
        opacity = 0.99 override 1 override 0.99 override # active|inactive|fullscreen
}

windowrule {
    name = ws4-office
        workspace = 3 
        match:class = ^(libreoffice|libreoffice-.*)$
}

windowrule {
    name = ws4-network
        workspace = 4
        match:class = ^(localsend|LocalSend)$
}

windowrule {
    name = ws-special-mail
        workspace = special:mail silent 
        match:class = ^(org\.mozilla\.Thunderbird)$
        no_initial_focus = on
}

# https://wiki.hypr.land/Configuring/Window-Rules/#layer-rules 
# Layers | Waybar, Wofi, Hyprpaper, etc... 
# layerrule {
#     name = waybar-layer
#     match:namespace = waybar
# }

layerrule { 
    name = wofi-layer-popup
        dim_around = on
        match:namespace = wofi 
}
